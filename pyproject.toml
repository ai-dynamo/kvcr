[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kvcr"
version = "0.1.0"
description = "Framework-neutral KV Cache Runner"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "msgspec>=0.21.0,<1",
  "pyzmq>=25.0.0,<28",
  "nixl==1.3.2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.16.3,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kvcr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Illustrative pseudo-code in design docs is laid out for readability, not for
# the formatter; keep `ruff format .` from rewriting it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
