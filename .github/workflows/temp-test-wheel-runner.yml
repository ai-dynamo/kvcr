# TEMP: proves the staged-wheel tests pass on the GPU tester runner; delete before merge.
name: TEMP test wheel on tester runner

on:
  push:
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: prod-kvcr-tester-amd-gpu-2-v1
    container:
      image: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.6"
          checksum: "8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477"
          enable-cache: false
      - name: Build the wheel
        id: build
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          echo "wheel=$(cd dist && ls kvcr-*.whl)" >> "${GITHUB_OUTPUT}"
          echo "version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "${GITHUB_OUTPUT}"
      - uses: ./.github/actions/test-wheel
        with:
          wheel: dist/${{ steps.build.outputs.wheel }}
          version: ${{ steps.build.outputs.version }}
          mode: nightly
