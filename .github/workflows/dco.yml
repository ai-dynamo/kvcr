name: DCO
on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test DCO validation policy
        run: node --test .github/scripts/check-dco.test.cjs
      - name: Check every PR commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const {checkPullRequest} = require('./.github/scripts/check-dco.cjs');
            await checkPullRequest({github, context, core});
