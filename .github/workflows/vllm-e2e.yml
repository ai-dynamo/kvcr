name: KVCR vLLM E2E

on:
  workflow_call:
    inputs:
      image:
        description: Immutable published KVCR image reference, including sha256 digest
        required: true
        type: string
      source_sha:
        description: Exact KVCR source commit installed in the image
        required: true
        type: string
      recipe_sha:
        required: true
        type: string
      image_profile:
        required: true
        type: string
      resolved_inputs_sha256:
        required: true
        type: string
      build_manifest_artifact:
        required: true
        type: string
      profile_selection:
        description: all, or comma-separated profile IDs for an explicitly diagnostic subset
        required: false
        type: string
        default: all

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/integration-e2e.yml
    with:
      integration: vllm
      image: ${{ inputs.image }}
      source_sha: ${{ inputs.source_sha }}
      recipe_sha: ${{ inputs.recipe_sha }}
      image_profile: ${{ inputs.image_profile }}
      resolved_inputs_sha256: ${{ inputs.resolved_inputs_sha256 }}
      build_manifest_artifact: ${{ inputs.build_manifest_artifact }}
      profile_selection: ${{ inputs.profile_selection }}
