name: KVCR vLLM E2E

on:
  workflow_call:
    inputs:
      image:
        description: Published KVCR image reference, preferably pinned by digest
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: Published KVCR image reference, preferably pinned by digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      configurations: ${{ steps.matrix.outputs.configurations }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Select vLLM configurations
        run: echo "configurations=$(python3 tests/e2e/run_ci_profile.py --matrix)" >> "$GITHUB_OUTPUT"

  profiles:
    name: ${{ matrix.profile }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.configurations) }}
    # Each job owns two GPUs; runner capacity determines parallelism.
    runs-on: prod-kvcr-tester-amd-gpu-2-v1
    container:
      image: ${{ inputs.image }}
    timeout-minutes: 95
    env:
      HF_HOME: /scratch/huggingface
      VLLM_CACHE_ROOT: /scratch/vllm
      XDG_CACHE_HOME: /scratch/cache
      KVCR_TEST_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Show NVIDIA devices
        run: nvidia-smi
      - name: Run tests
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          exec python3 -u tests/e2e/run_ci_profile.py \
            --profile "$PROFILE" --output-dir "artifacts/$PROFILE"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 14

  summary:
    name: Complete vLLM matrix
    if: always()
    needs: [matrix, profiles]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful jobs
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          TEST_RESULT: ${{ needs.profiles.result }}
        run: test "$MATRIX_RESULT" = success && test "$TEST_RESULT" = success
