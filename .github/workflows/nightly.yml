name: Nightly
run-name: Nightly (${{ github.event_name }} by @${{ github.actor }})

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: Stage the wheel and trigger the release pipeline. Scheduled runs always release.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Nightlies never wait on each other, as in Dynamo.
  group: nightly-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  wheel:
    name: Nightly
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release.yml
    # Without this, the called jobs see empty automated-release secrets.
    secrets: inherit
    with:
      mode: nightly
      stage: ${{ github.event_name == 'schedule' || inputs.release == true }}
