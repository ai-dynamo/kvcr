name: Docker Build

on:
  # copy-pr-bot mirrors trusted PR commits to pull-request/<number> branches.
  push:
    branches:
      - "pull-request/[0-9]+"
    # Empty commits do not retrigger this path-filtered workflow.
    paths:
      - .github/workflows/**
      - Dockerfile*
      - pyproject.toml
      - uv.lock
      - src/**
      - tests/e2e/**
  # Manual runs can override the vLLM image, Dynamo wheel, and KVCR ref.
  workflow_dispatch:
    inputs:
      base_image:
        description: vLLM image reference (nightly or PR image)
        required: true
        type: string
        default: vllm/vllm-openai:nightly
      dynamo_version:
        description: Dynamo wheel version for every image, or nightly for the newest dev wheel
        required: true
        type: string
        default: nightly
      kvcr_ref:
        description: KVCR ref to test (optional; e.g. refs/pull/23/merge)
        required: false
        type: string
      profile_selection:
        description: all, or comma-separated profile IDs for an explicitly diagnostic subset
        required: true
        type: string
        default: all

concurrency:
  # Runs for the same PR branch cancel each other.
  group: docker-build-${{ github.ref_name }}-${{ inputs.kvcr_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.inputs.outputs.source_sha }}
      recipe_sha: ${{ github.sha }}
      resolved_inputs_json: ${{ steps.inputs.outputs.json }}
      sglang_hicache_inputs_json: ${{ steps.inputs.outputs.sglang_hicache_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.kvcr_ref || github.sha }}
          path: kvcr-source
      - name: Resolve nightly policy and immutable inputs once for every image
        id: inputs
        env:
          BASE_IMAGE: ${{ inputs.base_image || 'vllm/vllm-openai:nightly' }}
          DYNAMO_POLICY: ${{ inputs.dynamo_version || 'nightly' }}
        run: |
          set -euo pipefail
          source_sha=$(git -C kvcr-source rev-parse HEAD)
          base_digest=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')
          base_name="${BASE_IMAGE%%@*}"
          if [[ "${base_name##*/}" == *:* ]]; then base_name="${base_name%:*}"; fi
          # One Dynamo release that serves every image's Python runtime.
          profiles=vllm,sglang-hicache
          resolved=$(python3 tests/e2e/ci_images.py --image-profile vllm \
            --source-sha "$source_sha" --recipe-sha "$GITHUB_SHA" \
            --base-image "${base_name}@${base_digest}" --dynamo-policy "$DYNAMO_POLICY" \
            --dynamo-profiles "$profiles" --output resolved-inputs.json)
          dynamo_version=$(jq -er '.dynamo_version' <<< "$resolved")
          # The SGLang base is digest-pinned in its recipe.
          sglang_base=$(sed -nE 's/^ARG SGLANG_IMAGE=(.+@sha256:[0-9a-f]{64})$/\1/p' \
            Dockerfile.quick-start-sglang)
          [[ -n "$sglang_base" ]] || { echo "SGLANG_IMAGE is not digest-pinned" >&2; exit 1; }
          sglang_hicache=$(python3 tests/e2e/ci_images.py --image-profile sglang-hicache \
            --source-sha "$source_sha" --recipe-sha "$GITHUB_SHA" \
            --base-image "$sglang_base" --dynamo-policy "$DYNAMO_POLICY" \
            --dynamo-profiles "$profiles" --dynamo-version "$dynamo_version" \
            --output resolved-inputs-sglang-hicache.json)
          # A single-line JSON output is data, never executable shell input.
          printf 'source_sha=%s\njson=%s\nsglang_hicache_json=%s\n' "$source_sha" \
            "$(jq -c 'del(.resolved_inputs_sha256)' <<< "$resolved")" \
            "$(jq -c 'del(.resolved_inputs_sha256)' <<< "$sglang_hicache")" >> "$GITHUB_OUTPUT"
          printf 'Dynamo for every image: `ai-dynamo==%s`\n' "$dynamo_version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kvcr-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: resolved-inputs*.json
          if-no-files-found: error
          retention-days: 14

  build-vllm:
    needs: resolve
    uses: ./.github/workflows/build-ci-image.yml
    with:
      image_profile: vllm
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      recipe_sha: ${{ needs.resolve.outputs.recipe_sha }}
      resolved_inputs_json: ${{ needs.resolve.outputs.resolved_inputs_json }}

  e2e-vllm:
    needs: build-vllm
    uses: ./.github/workflows/vllm-e2e.yml
    with:
      image: ${{ needs.build-vllm.outputs.image }}
      source_sha: ${{ needs.build-vllm.outputs.source_sha }}
      recipe_sha: ${{ needs.build-vllm.outputs.recipe_sha }}
      image_profile: ${{ needs.build-vllm.outputs.image_profile }}
      resolved_inputs_sha256: ${{ needs.build-vllm.outputs.resolved_inputs_sha256 }}
      build_manifest_artifact: ${{ needs.build-vllm.outputs.build_manifest_artifact }}
      profile_selection: ${{ inputs.profile_selection || 'all' }}

  # SGLang HiCache with the KVCR storage backend: its own image and lane. Each
  # e2e job consumes only its own build's outputs; the jobs share no runner
  # state, so the SGLang and vLLM lanes run in parallel.
  build-sglang-hicache:
    needs: resolve
    uses: ./.github/workflows/build-ci-image.yml
    with:
      image_profile: sglang-hicache
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      recipe_sha: ${{ needs.resolve.outputs.recipe_sha }}
      resolved_inputs_json: ${{ needs.resolve.outputs.sglang_hicache_inputs_json }}

  e2e-sglang-hicache:
    needs: build-sglang-hicache
    uses: ./.github/workflows/integration-e2e.yml
    with:
      integration: sglang-hicache
      image: ${{ needs.build-sglang-hicache.outputs.image }}
      source_sha: ${{ needs.build-sglang-hicache.outputs.source_sha }}
      recipe_sha: ${{ needs.build-sglang-hicache.outputs.recipe_sha }}
      image_profile: ${{ needs.build-sglang-hicache.outputs.image_profile }}
      resolved_inputs_sha256: ${{ needs.build-sglang-hicache.outputs.resolved_inputs_sha256 }}
      build_manifest_artifact: ${{ needs.build-sglang-hicache.outputs.build_manifest_artifact }}
      profile_selection: ${{ inputs.profile_selection || 'all' }}

  gpu-verdict:
    name: GPU E2E verdict
    if: always()
    needs: [resolve, build-vllm, e2e-vllm, build-sglang-hicache, e2e-sglang-hicache]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require full coverage from every active integration
        shell: bash
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PROFILE_SELECTION: ${{ inputs.profile_selection || 'all' }}
        run: |
          set -euo pipefail
          python3 tests/e2e/ci_verdict.py --job-results "$JOB_RESULTS" \
            --selection "$PROFILE_SELECTION" --output verdict/result.json
      - name: Save root verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kvcr-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: verdict/
          if-no-files-found: error
          retention-days: 14
