name: Docker Build

on:
  # copy-pr-bot mirrors trusted PR commits to pull-request/<number> branches.
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - .github/workflows/docker-build.yml
      - .github/workflows/vllm-e2e.yml
      - Dockerfile.ci
      - pyproject.toml
      - src/**
      - tests/e2e/**
  # The nightly and release workflows call this to test the wheel they staged.
  workflow_call:
    inputs:
      wheel:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string
      stage_path:
        required: true
        type: string
      base_image:
        required: false
        type: string
        default: vllm/vllm-openai:nightly
      dynamo_version:
        required: false
        type: string
        default: nightly
  # Manual runs can override the vLLM image, Dynamo wheel, and KVCR ref.
  workflow_dispatch:
    inputs:
      base_image:
        description: vLLM image reference (nightly or PR image)
        required: true
        type: string
        default: vllm/vllm-openai:nightly
      dynamo_version:
        description: Dynamo wheel version, or nightly for the newest dev wheel
        required: true
        type: string
        default: nightly
      kvcr_ref:
        description: KVCR ref to test (optional; e.g. refs/pull/23/merge)
        required: false
        type: string

concurrency:
  # Runs for the same PR branch cancel each other; every other run is isolated.
  group: docker-build-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: prod-kvcr-builder-v1
    environment: ${{ inputs.wheel != '' && 'wheel-read' || '' }}
    timeout-minutes: 45
    env:
      AWS_DEFAULT_REGION: us-west-2
      ECR_REPOSITORY: ai-dynamo/kvcr
      BUILDER_NAME: kvcr-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      digest: ${{ steps.published.outputs.digest }}
    steps:
      - name: Check out CI recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out KVCR source to test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.kvcr_ref || github.sha }}
          path: kvcr-source
          persist-credentials: false

      # Nightly and release runs test the exact wheel they staged; other runs build from source in the image.
      - name: Fetch the staged wheel
        if: inputs.wheel != ''
        env:
          WHEEL: ${{ inputs.wheel }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          STAGE_PATH: ${{ inputs.stage_path }}
          WHEEL_DIR: ${{ runner.temp }}/kvcr-wheel
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_READ_TOKEN: ${{ secrets.ARTIFACTORY_READ_TOKEN }}
          ARTIFACTORY_PYPI_REPO_NAME: ${{ secrets.ARTIFACTORY_PYPI_REPO_NAME }}
        run: |
          set -euo pipefail
          for name in ARTIFACTORY_URL ARTIFACTORY_READ_TOKEN ARTIFACTORY_PYPI_REPO_NAME; do
            [ -n "${!name}" ] || { echo "::error::secret ${name} is not set in the wheel-read environment"; exit 1; }
          done
          [[ "${WHEEL_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256 was given for ${WHEEL}"; exit 1; }
          host="${ARTIFACTORY_URL#*://}"
          echo "::add-mask::${host%%[/:]*}"
          auth="$(mktemp -p "${RUNNER_TEMP}")"
          trap 'rm -f "${auth}"' EXIT
          printf 'Authorization: Bearer %s\n' "${ARTIFACTORY_READ_TOKEN}" > "${auth}"
          mkdir -p "${WHEEL_DIR}"
          curl -q -fsS --retry 3 --max-time 120 -o "${WHEEL_DIR}/${WHEEL}" -H "@${auth}" \
            "${ARTIFACTORY_URL%/}/${ARTIFACTORY_PYPI_REPO_NAME}/${STAGE_PATH}/${WHEEL}"
          echo "${WHEEL_SHA256}  ${WHEEL_DIR}/${WHEEL}" | sha256sum --check

      - name: Inspect build environment
        run: |
          docker buildx version
          aws --version
          df -h

      # Credentials come from the runner's IRSA role. buildx forwards them to the
      # remote BuildKit pod, which performs the push.
      - name: Log in to ECR
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::repository secret AWS_ACCOUNT_ID is not set to an account ID"; exit 1; }
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # Route the build to the shared BuildKit service. KVCR is built on top of a
      # vLLM image, so it uses the vllm flavor (and its layer cache pool).
      # TODO: pin to a merged commit SHA once ai-dynamo/.github#9 lands.
      - name: Initialize shared BuildKit builder
        id: builder
        uses: ai-dynamo/.github/.github/actions/init-dynamo-builder@e8cb76eeca91bbac2ab5c2702bd8bd629b20dd3a
        with:
          builder_name: ${{ env.BUILDER_NAME }}
          flavor: vllm
          arch: linux/amd64
          namespace: buildkit

      - name: Resolve build inputs
        id: source
        shell: bash
        env:
          BASE_IMAGE: ${{ inputs.base_image || 'vllm/vllm-openai:nightly' }}
        run: |
          set -euo pipefail
          kvcr_sha=$(git -C kvcr-source rev-parse HEAD)
          # Resolve the base tag to an immutable digest with a registry query; the
          # builder has no docker daemon, so nothing is pulled locally. BuildKit
          # pulls the base layers itself.
          base_digest=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')
          base_name="${BASE_IMAGE%%@*}"
          if [[ "${base_name##*/}" == *:* ]]; then
            base_name="${base_name%:*}"
          fi
          base_image="${base_name}@${base_digest}"
          image_tag="${ECR_REGISTRY}/${ECR_REPOSITORY}:${kvcr_sha}"
          printf 'kvcr_sha=%s\nbase_image=%s\nimage_tag=%s\n' \
            "$kvcr_sha" "$base_image" "$image_tag" >> "$GITHUB_OUTPUT"

      # Built on the shared BuildKit builder and pushed straight to ECR; nothing
      # is loaded into a local docker daemon (the runner is a thin client without
      # one).
      - name: Build and publish integration image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          builder: ${{ env.BUILDER_NAME }}
          context: ./kvcr-source
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          load: false
          tags: ${{ steps.source.outputs.image_tag }}
          build-contexts: ${{ inputs.wheel != '' && format('kvcr-wheel={0}/kvcr-wheel', runner.temp) || '' }}
          build-args: |
            VLLM_IMAGE=${{ steps.source.outputs.base_image }}
            DYNAMO_VERSION=${{ inputs.dynamo_version || 'nightly' }}
            KVCR_COMMIT=${{ steps.source.outputs.kvcr_sha }}
            KVCR_WHEEL_SHA256=${{ inputs.wheel_sha256 }}

      - name: Record published image
        id: published
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Build did not return a published image digest"; exit 1; }
          printf 'digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'Image for downstream tests: `%s@%s`\n' "$ECR_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove builder configuration
        if: always() && (steps.builder.outcome == 'success' || steps.builder.outcome == 'failure')
        continue-on-error: true
        shell: bash
        run: |
          if docker buildx inspect "$BUILDER_NAME" > /dev/null 2>&1; then
            docker buildx rm "$BUILDER_NAME"
          fi

  e2e:
    needs: build
    uses: ./.github/workflows/vllm-e2e.yml
    with:
      image_digest: ${{ needs.build.outputs.digest }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
