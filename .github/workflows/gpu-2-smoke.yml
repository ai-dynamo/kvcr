name: GPU 2 Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-two-gpus:
    runs-on: prod-tester-amd-gpu-2-v2
    timeout-minutes: 10
    steps:
      - name: Show NVIDIA devices
        run: nvidia-smi
      - name: Require two visible GPUs
        shell: bash
        run: |
          set -euo pipefail
          gpu_count=$(nvidia-smi -L | wc -l)
          echo "visible_gpu_count=${gpu_count}"
          test "${gpu_count}" -ge 2
