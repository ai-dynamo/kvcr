#
# The AgentX trace pushed until KVCR is what limits a rank: the modelled GPU
# is cut down, answers are shortened fifty-fold (so a rank is not busy
# decoding), recorded waits are divided by ten and capped at 1.5 s, 16 plays
# are live per worker, a quarter of all turns land on another worker, and the
# KVCR pool is half the default so it evicts throughout the window. Prompts,
# contexts and sub-agents are the trace's own.
#
#   ... --config scenarios/agentx-fast.toml --set workload.trace=/path/agentx-062126.cbtrace
name = "agentx-fast"

[tiers]
g2_blocks = 32768

[engine]
step_ms = 0.2
prefill_us_per_token = 0.15

[workload]
trace = "agentx-062126.cbtrace"
sessions_per_worker = 16
trace_think_scale = 0.1
trace_output_scale = 0.02
think_cap_s = 1.5

[router]
migration_prob = 0.25

[phases]
fill_s = 45.0
measure_s = 60.0
